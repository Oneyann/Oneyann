name: 2D contributions

on:
  schedule:
    - cron: "17 3 * * *" # раз в сутки, чтобы график не отставал от коммитов
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-2d-contrib
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Собрать 2D-график вкладов
        run: node scripts/gen-2d-contrib.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Опубликовать в ветку output-2d-contrib
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-2d-contrib
          build_dir: profile-2d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
