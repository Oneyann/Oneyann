name: Profile stats

on:
  schedule:
    - cron: "17 3 * * *" # раз в сутки, чтобы цифры не отставали от коммитов
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-stats
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Собрать карточку языков и статистики
        run: node scripts/gen-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Опубликовать в ветку output-stats
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-stats
          build_dir: profile-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
