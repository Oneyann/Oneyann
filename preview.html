<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Предпросмотр профиля · Oneyann</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.css">
<style>
  html, body { margin: 0; background: #ffffff; }
  .page { box-sizing: border-box; max-width: 900px; margin: 0 auto; padding: 40px 24px 96px; }
  .hint {
    margin: 0 0 28px; padding: 10px 14px; border-radius: 8px;
    background: #f6f8fa; color: #656d76;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .markdown-body { box-sizing: border-box; max-width: 100%; font-size: 16px; }
  .markdown-body img { border-radius: 4px; }
  .error { color: #cf222e; font: 14px/1.5 sans-serif; }
</style>
</head>
<body>
<div class="page">
  <p class="hint">
    Локальный предпросмотр <code>README.md</code> в оформлении GitHub (светлая тема).
    График грузится с <code>raw.githubusercontent.com</code>, поэтому нужен интернет.
    На GitHub вместо него подставится ночной вариант, если включена тёмная тема.
  </p>
  <article id="out" class="markdown-body"></article>
</div>

<script id="src" type="text/markdown"><p align="center">
  <img width="520" alt="Языки и статистика" src="https://raw.githubusercontent.com/Oneyann/Oneyann/output-stats/day.svg" />
</p>

---

<div align="center">
  <sub>Пишу то, чем пользуюсь сам. Идеи и найденные баги — в issues репозиториев.</sub>
</div>
</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  (function () {
    var out = document.getElementById('out');
    var src = document.getElementById('src').textContent;
    if (typeof marked === 'undefined') {
      out.innerHTML = '<p class="error">Не загрузился рендерер markdown. Проверь подключение к интернету и обнови страницу.</p>';
      return;
    }
    out.innerHTML = marked.parse(src);
  })();
</script>
</body>
</html>
